<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Foods | Shopping Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #fffaf0; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { background: #2d5a27; padding: 15px 10%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .ff-logo-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #ffcc00; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .logo-text { color: white; font-size: 1.5rem; font-weight: bold; letter-spacing: 1px; }
        .nav-links { list-style: none; display: flex; align-items: center; gap: 5px; }
        .nav-links li a { text-decoration: none; color: white; font-weight: 600; padding: 8px 15px; border-radius: 4px; transition: 0.3s; }
        .nav-links li a:hover, .nav-links li a.active { background: rgba(255,255,255,0.15); color: #ffcc00; }
        .cart-badge { background: #ff4444; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; margin-left: 5px; }
        .burger { display: none; cursor: pointer; color: white; font-size: 1.8rem; }

        #cart-container { flex: 1; max-width: 800px; width: 90%; margin: 50px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #2d5a27; font-size: 2rem; margin-bottom: 20px; border-bottom: 2px solid #2d5a27; display: inline-block; padding-bottom: 10px; }
        #cart-items { text-align: left; margin-top: 20px; border-top: 1px solid #eee; max-height: 350px; overflow-y: auto; }
        .cart-item { background: #f9f9f9; padding: 15px; margin: 10px 0; border-left: 5px solid #2d5a27; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
        .remove-btn { background: #ff4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; transition: 0.3s; }
        .remove-btn:hover { background: #cc0000; }
        .cart-total { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: bold; margin-top: 25px; padding-top: 15px; border-top: 2px dashed #ddd; color: #2d5a27; }
        .checkout-btn { width: 100%; font-size: 1.1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; border-radius: 8px; transition: background 0.3s, transform 0.2s; margin-top: 20px; padding: 15px 30px; background: #2d5a27; color: white; border: none; cursor: pointer; }
        .checkout-btn:hover { background: #1e3d1a; transform: translateY(-2px); }

        footer { background: #2d5a27; color: white; padding: 40px 10%; text-align: center; margin-top: auto; }
        .footer-links { margin-bottom: 20px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .footer-links a { color: white; text-decoration: none; font-weight: 500; }
        .footer-links a:hover { color: #ffcc00; }
        .social-icons a { color: white; font-size: 1.5rem; margin: 0 10px; transition: 0.3s; }
        .social-icons a:hover { color: #ffcc00; }

        @media screen and (max-width: 768px) {
            .nav-links { display: none; flex-direction: column; width: 100%; background: #2d5a27; position: absolute; top: 75px; left: 0; padding: 20px 0; }
            .nav-links.active { display: flex; }
            .burger { display: block; }
            #cart-container { margin: 20px auto; padding: 20px; }
        }
        @media screen and (min-width: 1024px) {
            .nav-links { display: flex !important; }
            .burger { display: none; }
        }
    </style>
    <link rel="stylesheet" href="/src/responsive.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo-container">
            <img src="FF logo (1).jpg" alt="FF Logo" class="ff-logo-img">
            <span class="logo-text">FRESH FOODS</span>
        </a>
        <div class="burger" onclick="toggleMenu()">☰</div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="product.html">Products</a></li>
            <li><a href="reservation.html">Reservations</a></li>
            <li><a href="cart.html" class="active"><i class="fas fa-shopping-cart"></i> Cart <span id="cart-count" class="cart-badge">0</span></a></li>
            <li><a href="index.html#auth">Login/Signup</a></li>
        </ul>
    </nav>

    <div id="cart-container">
        <h2>Your Shopping Cart</h2>
        <div id="cart-items"></div>
        <div id="cart-summary"></div>
        <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
    </div>

    <footer>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="reservation.html">Reservations</a>
        </div>
        <div class="social-icons">
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
        </div>
        <p>&copy; 2026 Fresh Foods (FF). All rights reserved.</p>
    </footer>

    <script>
        let items = JSON.parse(localStorage.getItem('cart')) || [];
        const container = document.getElementById('cart-items');
        const summaryContainer = document.getElementById('cart-summary');
        
        function renderCart() {
            container.innerHTML = '';
            summaryContainer.innerHTML = '';
            
            if(items.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888; padding:30px;">Your cart is empty.</p>';
                document.getElementById('cart-count').innerText = 0;
                return;
            }
            
            let total = 0;
            items.forEach((item, index) => {
                total += item.price;
                container.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <span>₹${item.price} <button class="remove-btn" onclick="removeItem(${index})"><i class="fas fa-trash"></i> Remove</button></span>
                    </div>`;
            });
            
            summaryContainer.innerHTML = `
                <div class="cart-total">
                    <span>Total Amount:</span>
                    <span>₹${total}</span>
                </div>`;
            
            document.getElementById('cart-count').innerText = items.length;
        }

        function removeItem(index) {
            items.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(items));
            renderCart();
        }

        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }

        function checkout() {
            if(items.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            window.location.href = "success.html";
        }

        renderCart();
    </script>
</body>
</html>
